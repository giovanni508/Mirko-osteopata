# A ogni push su main copia la cartella public/ nel branch gh-pages,
# che GitHub Pages pubblica su https://giovanni508.github.io/Mirko-osteopata/
name: Pubblica il sito

on:
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggiorna il branch gh-pages con public/
        run: |
          git subtree split --prefix public -b gh-pages
          git push --force origin gh-pages
